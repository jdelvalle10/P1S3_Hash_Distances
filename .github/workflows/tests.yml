name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up CPython 3.12 (the reference environment)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite passes --allow-unpinned internally, so it also runs when a
      # dependency (e.g. SciPy) resolves to a version other than the protocol pins.
      - name: Run the test suite (no network)
        run: python -m unittest discover -s tests -v
